<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chhora BD - Bangla Nursery Rhymes</title>
<meta name="description" content="10 classic Bangla nursery rhymes for little ones - read, listen, learn by heart. Fully offline.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-emoji" aria-hidden="true">&#127881;</span>
    <div>
      <h1 id="appTitle">Chhora BD</h1>
      <p id="appSubtitle" class="subtitle"></p>
    </div>
  </div>
  <button id="langBtn" class="btn ghost" type="button">Bangla</button>
</header>

<main>
  <section id="homeView">
    <div class="rod-wrap">
      <p id="rhymeOfDayLabel" class="section-label"></p>
      <button id="rhymeOfDayCard" class="rod" type="button"></button>
    </div>

    <div class="controls">
      <input id="search" type="search" autocomplete="off">
      <button id="surpriseBtn" class="btn" type="button"></button>
      <button id="favOnlyBtn" class="btn ghost" type="button" aria-pressed="false"></button>
    </div>
    <div id="catChips" class="chips" role="group" aria-label="Categories"></div>
    <p id="progressText" class="progress"></p>

    <div id="rhymeGrid" class="grid"></div>
    <p id="emptyState" class="empty" style="display:none"></p>
  </section>

  <section id="readerView" style="display:none">
    <button id="backBtn" class="btn ghost" type="button"></button>
    <article class="reader">
      <div class="reader-head">
        <span id="readerEmoji" class="reader-emoji" aria-hidden="true"></span>
        <div>
          <h2 id="readerTitle"></h2>
          <p id="readerAuthor" class="author"></p>
          <p id="readerSource" class="source"></p>
          <p id="excerptBadge" class="badge" style="display:none"></p>
        </div>
      </div>

      <ol id="readerLines" class="lines fs-m"></ol>
      <label class="roman-toggle"><input id="romanToggle" type="checkbox"> <span id="romanLabel"></span></label>
      <ol id="romanLines" class="lines roman" style="display:none"></ol>

      <div class="meaning">
        <p id="meaningLabel" class="meaning-label"></p>
        <p id="meaningText"></p>
      </div>

      <div class="actions">
        <button id="speakBtn" class="btn primary" type="button"></button>
        <button id="favBtn" class="btn" type="button"></button>
        <button id="learnedBtn" class="btn" type="button"></button>
        <button id="printBtn" class="btn" type="button"></button>
      </div>
      <p id="voiceNote" class="note" style="display:none"></p>

      <div class="reader-nav">
        <button id="prevBtn" class="btn ghost" type="button"></button>
        <div class="fontctl">
          <span id="fontLabel"></span>
          <button id="fontMinus" class="btn small" type="button" aria-label="Smaller text">A-</button>
          <button id="fontPlus" class="btn small" type="button" aria-label="Larger text">A+</button>
        </div>
        <button id="nextBtn" class="btn ghost" type="button"></button>
      </div>
    </article>
  </section>
</main>

<footer>
  <p id="footerNote"></p>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/rhymes.js"></script>
<script src="js/i18n.js"></script>
<script src="js/logic.js"></script>
<script src="js/app.js"></script>
</body>
</html>
